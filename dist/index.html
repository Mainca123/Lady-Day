<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>A World of Gifts - Thế Giới Quà Tặng</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23d4af37'><path d='M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7m16 0H4m16 0-3.5-7h-9L4 12m8-7v7'/></svg>" />
    <script type="module" crossorigin src="/assets/index-DRgPqasT.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D99MGvVb.css">
  </head>
  <body>
    <div id="app">
      <!-- MÀN HÌNH 1: ĐỊA CẦU 3D CINEMATIC -->
      <section id="globe-screen">
        <header class="app-header">
          <p class="title-tagline">A World of Gifts</p>
          <h1 class="main-title">Thế Giới Của Những Điểm Sáng</h1>
          <p class="sub-title">Mỗi người là một điểm sáng riêng biệt. Hôm nay có một món quà đang chờ bạn.</p>
        </header>

        <!-- Container chứa Quả cầu 3D Three.js -->
        <div id="canvas-container"></div>

        <!-- Chỉ dẫn tương tác -->
        <div class="interaction-hint">
          <span class="hint-icon">✦</span>
          <span>Kéo xoay địa cầu và chạm vào điểm sáng chân dung của bạn</span>
        </div>

        <!-- Popup Xác nhận chọn người nhận (Không dùng alert()) -->
        <div class="confirm-overlay" id="confirm-overlay">
          <div class="confirm-card">
            <div class="confirm-avatar-wrapper">
              <img id="confirm-avatar" src="" alt="Chân dung" class="confirm-avatar-img" />
              <div class="confirm-avatar-aura"></div>
            </div>
            <p class="confirm-question">Có phải bạn là</p>
            <h2 class="confirm-name" id="confirm-name">...</h2>
            <div class="confirm-role" id="confirm-role">...</div>
            <div class="confirm-actions">
              <button class="btn-secondary" id="btn-cancel-select">
                <span>Chọn lại</span>
              </button>
              <button class="btn-primary" id="btn-confirm-gift">
                <span class="btn-icon">🎁</span>
                <span>Nhận quà ngay</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- MÀN HÌNH 2: CHUỖI MỞ QUÀ 3D -->
      <section id="gift-screen">
        <div id="gift-container" style="width: 100%; height: 100%;"></div>
      </section>
    </div>

  </body>
</html>
