server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Kích hoạt nén Gzip tối ưu tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Hỗ trợ SPA routing (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cấu hình tối ưu phát file âm thanh (MP3) và hình ảnh
    location ~* \.(?:mp3|wav|ogg|jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # Hỗ trợ HTTP Range Requests cho phép tua/phát streaming mượt mà
        proxy_buffering off;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # Cache tài nguyên tĩnh (JS, CSS đã băm mã hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Tắt log các file favicon và robots
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}
